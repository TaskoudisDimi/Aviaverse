server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker bootstrap, the worker itself, and the manifest are
    # fetched by stable (non-hashed) URLs and must be re-checked on every
    # deploy — a CDN caching these for hours silently pins every visitor to
    # the previous build.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
